# Kitty Configuration
# Save this as ~/.config/kitty/kitty.conf

##################### extra #######################
# font_family      Myna
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# font_size        13.5
###################################################


# Font configuration
font_family      Myna
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13

# font_features MonaspaceXenonVar-Regular +calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09 +ss10

# Font rendering
text_composition_strategy platform
disable_ligatures never

# Window appearance
# background_opacity 0.80
# background_image ~/Downloads/wallpapers/gradient.jpg
# background_image_layout scaled
# background_tint 0.10
window_padding_width 0
hide_window_decorations yes
confirm_os_window_close 0

# Tab bar
tab_bar_style hidden

# Cursor settings
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 5

# Scrolling
scrollback_lines 1000
scrollback_indicator_opacity 0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor no

# Color scheme (darkvoid theme)
foreground #c0c0c0
# background #001419
background #2b2b2b
cursor #FFD700
cursor_text_color #152528
selection_foreground #c0c0c0
selection_background #303030

# ANSI colors (0-7)
color0  #1c1c1c
color1  #e62020
color2  #66b2b2
color3  #d1d1d1
color4  #b1b1b1
color5  #b16286
color6  #1bfd9c
color7  #c0c0c0

# Bright colors (8-15)
color8  #404040
color9  #b2beb5
color10 #b8bb26
color11 #bdfe58
color12 #6a7a8a
color13 #d3869b
color14 #b2d8d8
color15 #ebdbb2

# Tab colors (even though tabs are hidden, keeping for consistency)
active_tab_foreground   #c0c0c0
active_tab_background   #303030
inactive_tab_foreground #585858
inactive_tab_background #1c1c1c

# Key mappings
map shift+insert no_op
map ctrl+insert no_op
map ctrl+shift+apostrophe no_op
map ctrl+shift+5 no_op
map ctrl+t no_op

# Reset font size binding (equivalent to your ctrl+0)
map ctrl+0 change_font_size all 0

# Bell settings
enable_audio_bell no
visual_bell_duration 0.0

# Mouse settings
mouse_hide_wait 3.0
url_color #7fbfff
url_style curly

# Advanced settings
allow_remote_control no
update_check_interval 0
startup_session none
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Shell integration
shell_integration enabled

# Window layout
enabled_layouts *
window_resize_step_cells 2
window_resize_step_lines 2

# OS specific settings
linux_display_server auto

# Notification settings  
notify_on_cmd_finish invisible 10.0
